services:
  api:
    build: .
    restart: unless-stopped
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://CONTAINER_NAME:5432/billing
      DB_PASSWORD: ${DB_PASSWORD}
    ports: ["127.0.0.1:8085:8080"]
    networks: [shared]

networks:
  shared:
    external: true
    name: NETWORK_NAME_FROM_ABOVE
