services:
  api:
    build: .
    restart: unless-stopped
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://host.docker.internal:5432/billing
      SPRING_R2DBC_USERNAME: billing
      DB_PASSWORD: ${DB_PASSWORD}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8085:8080"]
