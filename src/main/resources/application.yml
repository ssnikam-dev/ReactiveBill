spring:
  application:
    name: reactive-billing-api
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/billing
    username: billing
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always        # runs schema.sql at startup (R2DBC has no auto DDL)

logging:
  level:
    com.billing: INFO

server:
  port: 8085

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
